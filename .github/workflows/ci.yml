name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit

  kicad-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install KiCad 9 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
      - run: kicad-cli version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          KICAD_CLI_INTEGRATION: "1"
          KICAD_INTEGRATION_WORKSPACE: ${{ github.workspace }}/data/kicad

  avr-firmware-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install AVR cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr binutils-avr avr-libc
      - run: avr-gcc --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          AVR_GCC_INTEGRATION: "1"

  arm-firmware-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ARM embedded cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
      - run: arm-none-eabi-gcc --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          ARM_GCC_INTEGRATION: "1"
